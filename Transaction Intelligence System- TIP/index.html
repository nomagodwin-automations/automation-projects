<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIP — Know Your Money</title>
    <link rel="stylesheet" href="tip-frontend.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  </head>

  <body>
    <!-- ══════════════════════════════════
       SCREEN 1 — IDENTITY
  ══════════════════════════════════ -->
    <section id="s-identity" class="screen active">
      <div class="wordmark">TIP</div>
      <p class="tagline">Know Your Money</p>
      <form class="identity-form" id="identity-form" onsubmit="return false;">
        <div class="field">
          <label>Your Name</label>
          <input
            id="inp-name"
            type="text"
            placeholder="What should we call you?"
            autocomplete="name"
          />
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input
            id="inp-phone"
            type="tel"
            placeholder="+234 800 000 0000"
            autocomplete="tel"
          />
        </div>
        <p class="error-msg hidden" id="identity-error"></p>
        <br />
        <button
          class="btn btn-primary"
          id="identity-btn"
          onclick="handleIdentity()"
        >
          Continue
        </button>
      </form>
    </section>

    <!-- ══════════════════════════════════
       SCREEN 2 — UPLOAD
  ══════════════════════════════════ -->
    <section id="s-upload" class="screen">
      <div class="upload-header">
        <p
          style="
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            margin-bottom: 6px;
          "
          id="upload-greeting"
        ></p>
        <h1>Upload your statement</h1>
        <p>PDF bank statement — we'll handle the rest</p>
      </div>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".pdf" />
        <div class="drop-icon">
          <svg viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
          </svg>
        </div>
        <h3>Drop your PDF here</h3>
        <p>or tap to browse</p>
      </div>

      <div class="file-selected hidden" id="file-preview">
        <div class="file-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5z"
            />
          </svg>
        </div>
        <div>
          <div class="file-name" id="file-name-display"></div>
        </div>
        <button
          class="file-clear"
          type="button"
          aria-label="Remove selected file"
          onclick="clearFile()"
        >
          ✕
        </button>
      </div>

      <button
        class="btn btn-primary"
        id="upload-btn"
        onclick="handleUpload()"
        disabled
      >
        Read My Finances
      </button>

      <div class="prev-uploads hidden" id="prev-uploads">
        <h4>Previous uploads</h4>
        <div id="prev-list"></div>
      </div>
    </section>

    <!-- ══════════════════════════════════
       SCREEN 3 — PROCESSING
  ══════════════════════════════════ -->
    <section id="s-processing" class="screen">
      <div class="processing-orb"></div>
      <div class="processing-copy" id="processing-copy">
        Reading your statement…
      </div>
      <p class="processing-sub">This usually takes 20–40 seconds</p>
      <div class="processing-dots"><span></span><span></span><span></span></div>
    </section>

    <!-- ══════════════════════════════════
       SCREEN 4 — STORY
  ══════════════════════════════════ -->
    <section id="s-story" class="screen">
      <!-- Spotify-style progress strips at top -->
      <div class="story-progress-strips" id="progress-strips"></div>

      <!-- Top bar -->
      <div class="story-topbar">
        <div class="wordmark">TIP</div>
        <div class="story-actions">
          <button
            class="btn btn-icon"
            type="button"
            title="Download Report"
            aria-label="Download Report"
            onclick="downloadPDF()"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h5.66V9h3.84L12 2z" />
            </svg>
          </button>
          <button
            class="btn btn-icon"
            type="button"
            title="View Full Breakdown"
            aria-label="View Full Breakdown"
            onclick="showBreakdown()"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Card track -->
      <div class="cards-track" id="cards-track"></div>

      <!-- Bottom nav -->
      <div class="story-bottombar">
        <div class="nav-arrow" id="nav-prev" onclick="navCard(-1)">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
          </svg>
        </div>
        <div class="dots-nav" id="dots-nav"></div>
        <div class="nav-arrow" id="nav-next" onclick="navCard(1)">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
          </svg>
        </div>
      </div>
    </section>

    <!-- ══════════════════════════════════
       SCREEN 5 — BREAKDOWN
  ══════════════════════════════════ -->
    <section id="s-breakdown" class="screen">
      <div class="breakdown-header">
        <button
          class="btn btn-icon"
          type="button"
          aria-label="Back to story"
          onclick="showStory()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path
              d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
            />
          </svg>
        </button>
        <h2>Full Breakdown</h2>
        <span class="badge" id="tx-count-badge"></span>
      </div>
      <div class="tx-table-wrap">
        <table class="tx-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Category</th>
              <th style="text-align: right">Amount</th>
            </tr>
          </thead>
          <tbody id="tx-tbody"></tbody>
        </table>
      </div>
    </section>

    <script src="tip-frontend.js"></script>
  </body>
</html>
```
